name: QA Selah Live

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-release:
    name: Código y transmisión
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Ejecutar compuerta de publicación
        run: npm run qa:release
